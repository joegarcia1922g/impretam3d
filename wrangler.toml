# Updated configuration for Cloudflare Pages
pages_build_output_dir = "./"
compatibility_date = "2025-05-29"

[env.development]
name = "impretam3d-dev"
workers_dev = true

[env.production]
name = "impretam3d"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "impretam3d-db"
database_id = "11960351-7df3-4aea-a7cb-ecb73691fda3"

[[r2_buckets]]
binding = "IMP_FILES_BUCKET"
bucket_name = "impretam3d-files"
